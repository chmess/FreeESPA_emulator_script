<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeESPA · 4.4.4</title><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#09131d;--panel:#122234;--line:#29445d;--text:#e9f2f9;--muted:#9ab1c2;--mint:#61dec0;--red:#ff8790}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}header,main{max-width:1300px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{font-size:28px;margin:4px 0}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.field{display:grid;gap:5px;margin:9px 0;color:var(--muted)}input,select,button{font:inherit;color:var(--text);background:#102134;border:1px solid #43647e;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#1c3b50}.row{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:flex;gap:9px;flex-wrap:wrap}.metric{background:#173047;border:1px solid var(--line);padding:8px 12px;border-radius:8px}.metric b{display:block;color:var(--mint);font-size:20px}.log{height:65vh;overflow:auto}table{width:100%;border-collapse:collapse;font:13px ui-monospace,monospace}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--line);vertical-align:top}.error{color:var(--red)}small{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><small>Windows · PowerShell · keine Installation</small><h1>FreeESPA 4.4.4</h1></div><strong id="status">getrennt</strong></header><main><div class="grid"><section><h2>Verbindung</h2><label class="field">Transport<select id="transport"><option value="serial">Serieller COM-Port</option><option value="tcp_client">TCP-Client</option><option value="tcp_listen">TCP-Server</option></select></label><label class="field">COM-Port<input id="serial_port" value="COM1"></label><label class="field">Baudrate<select id="baud"><option>300</option><option>600</option><option selected>1200</option><option>2400</option><option>4800</option><option>9600</option><option>19200</option></select></label><label class="field">Datenbits<select id="bits"><option selected>7</option><option>8</option></select></label><label class="field">Parität<select id="parity"><option selected>E</option><option>N</option><option>O</option></select></label><label class="field">Stoppbits<select id="stops"><option selected>2</option><option>1</option></select></label><label class="field">TCP-Adresse<input id="host" value="127.0.0.1"></label><label class="field">TCP-Port<input id="port" value="3000"></label><div class="row"><button onclick="ports()">COM-Ports laden</button><button onclick="start()">Verbinden</button><button onclick="post('stop',{})">Trennen</button></div><hr><h3>Rohdaten senden</h3><input id="hex" placeholder="06 04 31 05"><button onclick="raw()">Senden</button><button onclick="post('reset',{})">Verlauf löschen</button><p id="note"></p></section><section><h2>ESPA Telegrammverlauf</h2><div class="metrics" id="metrics"></div><div class="log"><table><thead><tr><th>Zeit</th><th>Richtung</th><th>Typ</th><th>Hex</th><th>Inhalt</th></tr></thead><tbody id="events"></tbody></table></div></section></div></main><script>
const $=id=>document.getElementById(id);async function post(a,b){let r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();$('note').textContent=j.error||'';return j}async function start(){let c={transport:$('transport').value,serial_port:$('serial_port').value,baud:+$('baud').value,bits:+$('bits').value,parity:$('parity').value,stops:+$('stops').value,host:$('host').value,port:+$('port').value};await post('start',c);refresh()}async function raw(){await post('raw',{hex:$('hex').value});refresh()}async function ports(){let r=await fetch('/api/ports');let p=await r.json();if(p.length)$('serial_port').value=p[0].path;$('note').textContent=p.length?p.map(x=>x.path+' · '+x.label).join(', '):'Keine COM-Ports gefunden'}async function refresh(){try{let s=await(await fetch('/api/state')).json();$('status').textContent=s.status+(s.error?' · '+s.error:'');$('metrics').innerHTML=Object.entries(s.traffic).map(([k,v])=>`<div class="metric"><b>${v.rx+v.tx}</b>${k} · RX ${v.rx} / TX ${v.tx}</div>`).join('');$('events').innerHTML=s.events.slice().reverse().map(e=>`<tr><td>${e.time.slice(11,23)}</td><td>${e.direction}</td><td>${e.kind}</td><td>${e.hex}</td><td>${e.summary||e.info||''}</td></tr>`).join('')}catch(e){$('status').textContent='Server nicht erreichbar'}}refresh();setInterval(refresh,700)}</script></body></html>
